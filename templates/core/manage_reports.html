{% extends 'base.html' %}{% block content %}<h1>Review reports</h1>{% for r in reports %}<div class="review-card my-2"><b>{{ r.review.movie.title }}</b> · {{ r.user.username }}<p>{{ r.reason }}</p><p>{{ r.review.text }}</p>{% if not r.resolved %}<form method="post">{% csrf_token %}<input type="hidden" name="report_id" value="{{ r.id }}"><button class="btn btn-sm btn-success">Mark resolved</button></form>{% else %}<span class="badge bg-success">Resolved</span>{% endif %}</div>{% empty %}<p>No reports.</p>{% endfor %}{% endblock %}
