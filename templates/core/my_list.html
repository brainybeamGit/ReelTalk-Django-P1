{% extends 'base.html' %}{% block content %}<h1>My movie list</h1><div class="row g-3">{% for entry in entries %}<div class="col-md-6"><div class="review-card"><a href="{% url 'movie_detail' entry.movie.id %}"><b>{{ entry.movie.title }}</b></a><span class="badge bg-secondary ms-2">{{ entry.get_status_display }}</span><div class="text-secondary small">{{ entry.movie.year }}</div></div></div>{% empty %}<p class="text-secondary">Your list is empty. Explore movies to add some.</p>{% endfor %}</div>{% endblock %}
