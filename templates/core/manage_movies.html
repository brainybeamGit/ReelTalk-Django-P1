{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h1>Manage movies</h1><a class="btn btn-danger" href="{% url 'movie_create' %}">Add movie</a></div><div class="table-responsive"><table class="table table-dark table-striped mt-3"><tr><th>Title</th><th>Year</th><th>Actions</th></tr>{% for m in movies %}<tr><td>{{ m.title }}</td><td>{{ m.year }}</td><td><a href="{% url 'movie_edit' m.id %}">Edit</a> · <a href="{% url 'movie_delete' m.id %}">Delete</a></td></tr>{% endfor %}</table></div><a href="{% url 'manage_reports' %}">Moderate review reports</a>{% endblock %}
