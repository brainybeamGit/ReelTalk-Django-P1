<div class="col-6 col-md-4 col-lg-3"><a class="movie-card" href="{% url 'movie_detail' movie.id %}">
{% if movie.poster %}<img src="{{ movie.poster.url }}" alt="{{ movie.title }} poster">{% else %}<div class="poster-placeholder">🎬</div>{% endif %}
<div class="p-3"><h5>{{ movie.title }}</h5><div class="small text-secondary">{{ movie.year }} · {{ movie.director }}</div><div class="text-warning mt-2">★ {{ movie.average_rating|default:"New" }} <span class="text-secondary">({{ movie.review_count }} reviews)</span></div></div></a></div>
