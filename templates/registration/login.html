{% extends 'base.html' %}{% block title %}Login · ReelTalk{% endblock %}{% block content %}
<div class="form-card mx-auto"><h2>Welcome back</h2><p class="text-secondary">Sign in to your movie community.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-danger w-100">Login</button></form>
<p><a href="{% url 'password_reset' %}">Forgot password?</a></p><p class="mt-3">New here? <a href="{% url 'register' %}">Create an account</a></p></div>{% endblock %}
